interface:
  display_name: "CCF Paper Writer"
  short_description: "Draft complete papers from research documents; revise and polish."
  default_prompt: "Use $ccf-paper-writer for the requested manuscript. Apply $ccf-humanization and preserve the supplied science and source format. For a new paper, integrate the research documents, draft full content without an initial page quota, honor requested result blanks, and check global alignment before requested length fitting. Keep local edits local and load only relevant references."
